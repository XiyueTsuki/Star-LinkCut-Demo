bind 0.0.0.0
port 6379

# ==================== 密码认证 ====================
requirepass redis123

# ==================== 持久化配置 ====================
appendonly yes
appenddirname appendonlydir
save 900 1
save 300 10
save 60 10000

# ==================== 内存管理 ====================
maxmemory 512mb
maxmemory-policy allkeys-lru

# ==================== 连接配置 ====================
timeout 300
tcp-keepalive 60
maxclients 10000

# ==================== 日志配置 ====================
loglevel notice
logfile /data/redis.log