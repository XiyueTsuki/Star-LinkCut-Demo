bind 0.0.0.0
port 6380

requirepass redis123
masterauth redis123

appendonly yes
appenddirname appendonlydir
save 900 1
save 300 10
save 60 10000

maxmemory 512mb
maxmemory-policy allkeys-lru

timeout 300
tcp-keepalive 60
maxclients 10000

loglevel notice

replica-read-only yes
replica-serve-stale-data yes
replica-priority 100
min-replicas-to-write 1
min-replicas-max-lag 10